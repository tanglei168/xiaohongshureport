[project]
name = "xiaohongshureport"
version = "0.1.0"
description = "小红书账号运营研究工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "httpx",
    "lxml",
    "loguru",
    "playwright==1.55.0",
    "pydantic>=2",
    "pydantic-settings",
    "rich",
    "typer",
]

[project.scripts]
xhs-report = "xiaohongshureport.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
